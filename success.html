<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 - Naver SEO Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d1a;
      color: #e0e0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #14142a;
      border: 1px solid #2a2a45;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .icon { font-size: 48px; margin-bottom: 16px; }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #8080a0; margin-bottom: 28px; line-height: 1.6; }

    .status-box {
      background: rgba(3,199,90,.08);
      border: 1px solid rgba(3,199,90,.2);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.8;
      text-align: left;
    }
    .status-box .label { color: #8080a0; font-size: 11px; }
    .status-box .value { color: #e0e0f0; font-weight: 600; }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #2a2a45;
      border-top-color: #03c75a;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 13px; color: #8080a0; }

    .manual-box {
      background: #1a1a30;
      border: 1px solid #2a2a45;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: left;
    }
    .manual-box p { font-size: 12px; color: #8080a0; margin-bottom: 8px; line-height: 1.6; }
    .license-display {
      font-family: monospace;
      font-size: 12px;
      color: #03c75a;
      background: #0d0d1a;
      border: 1px solid #2a2a45;
      border-radius: 6px;
      padding: 10px 12px;
      word-break: break-all;
      cursor: pointer;
      user-select: all;
    }
    .copy-hint { font-size: 10px; color: #5a5a80; margin-top: 6px; }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #03c75a;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }

    #state-loading, #state-success, #state-manual, #state-error { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <!-- 로딩 상태 -->
    <div id="state-loading">
      <div class="spinner"></div>
      <div class="loading-text">결제를 확인하고 있어요...</div>
    </div>

    <!-- 자동 활성화 성공 -->
    <div id="state-success">
      <div class="icon">🎉</div>
      <h1>Pro 활성화 완료!</h1>
      <p class="subtitle">확장프로그램에 Pro가 자동으로 적용됐어요.<br>네이버 블로그로 이동해서 무제한 분석을 시작하세요!</p>
      <a href="https://blog.naver.com" class="btn">네이버 블로그로 이동</a>
    </div>

    <!-- 수동 입력 안내 (확장프로그램 통신 실패 시) -->
    <div id="state-manual">
      <div class="icon">✅</div>
      <h1>결제 완료!</h1>
      <p class="subtitle">아래 라이선스 키를 복사해서<br>확장프로그램 팝업의 "키 입력" 버튼에 붙여넣으세요.</p>
      <div class="manual-box">
        <p>라이선스 키 (클릭하면 복사)</p>
        <div class="license-display" id="license-display" onclick="copyKey()"></div>
        <div class="copy-hint" id="copy-hint">클릭하면 클립보드에 복사됩니다</div>
      </div>
      <a href="https://blog.naver.com" class="btn">네이버 블로그로 이동</a>
    </div>

    <!-- 오류 -->
    <div id="state-error">
      <div class="icon">⚠️</div>
      <h1>결제 확인 실패</h1>
      <p class="subtitle" id="error-detail">결제는 완료됐으나 확인 중 오류가 발생했습니다.<br>hyunjinri@gmail.com으로 문의해 주세요.</p>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://naver-seo.hyunjinri.workers.dev";

    const urlParams = new URLSearchParams(location.search);
    const paymentKey = urlParams.get("paymentKey");
    const orderId    = urlParams.get("orderId");
    const amount     = Number(urlParams.get("amount"));
    const extId      = urlParams.get("ext") || "";

    let globalLicenseKey = null;

    function show(stateId) {
      ["state-loading", "state-success", "state-manual", "state-error"].forEach(id => {
        document.getElementById(id).style.display = id === stateId ? "block" : "none";
      });
    }

    function copyKey() {
      if (!globalLicenseKey) return;
      navigator.clipboard.writeText(globalLicenseKey).then(() => {
        document.getElementById("copy-hint").textContent = "✓ 복사됐어요!";
        setTimeout(() => {
          document.getElementById("copy-hint").textContent = "클릭하면 클립보드에 복사됩니다";
        }, 2000);
      });
    }

    async function confirmPayment() {
      show("state-loading");

      if (!paymentKey || !orderId || !amount) {
        show("state-error");
        document.getElementById("error-detail").textContent =
          "결제 파라미터가 없습니다. 결제가 취소됐거나 잘못된 접근입니다.";
        return;
      }

      // 1. Worker에 결제 승인 요청
      let licenseKey;
      try {
        const res = await fetch(`${WORKER_URL}/payment/confirm`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paymentKey, orderId, amount })
        });
        const data = await res.json();
        if (!res.ok || !data.licenseKey) throw new Error(data.message || "승인 실패");
        licenseKey = data.licenseKey;
        globalLicenseKey = licenseKey;
      } catch (e) {
        show("state-error");
        document.getElementById("error-detail").textContent =
          `결제 승인 중 오류가 발생했습니다: ${e.message}\n문의: hyunjinri@gmail.com`;
        return;
      }

      // 2. 확장프로그램에 라이선스 키 전송
      if (extId && typeof chrome !== "undefined" && chrome.runtime) {
        try {
          chrome.runtime.sendMessage(extId, { type: "SET_LICENSE", key: licenseKey }, (res) => {
            if (chrome.runtime.lastError || !res?.ok) {
              showManual(licenseKey);
            } else {
              show("state-success");
            }
          });
          return;
        } catch(e) { /* fallthrough to manual */ }
      }

      // 확장프로그램 통신 불가 → 수동 입력 안내
      showManual(licenseKey);
    }

    function showManual(key) {
      document.getElementById("license-display").textContent = key;
      show("state-manual");
    }

    confirmPayment();
  </script>
</body>
</html>
